version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: process-controller-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: process-controller-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

